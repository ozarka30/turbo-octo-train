[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jptutor"
version = "0.1.0"
description = "An AI Japanese tutor that reads, translates, and breaks down in-game text while you play."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.3,<2",
    "pydantic>=2",
    "mss>=9",
    "pillow>=10",
    "numpy>=1.26",
    "edge-tts>=6.1",
    "pygame>=2.5",
]

[project.optional-dependencies]
hotkey = ["pynput>=1.7"]
dev = ["pytest>=8"]

[project.scripts]
jptutor = "jptutor.cli:main"

[tool.setuptools.packages.find]
include = ["jptutor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
